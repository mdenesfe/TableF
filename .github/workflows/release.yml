name: Release

# Builds the desktop apps on native runners (so cgo engines like DuckDB are
# included on every platform) and attaches the Windows build to a GitHub
# release. The macOS build is kept as a CI artifact; the released macOS app
# is signed and notarized separately.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: TableF-macos-universal.zip
          - os: windows-latest
            platform: windows/amd64
            artifact: TableF-windows-amd64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: wails build -clean -platform ${{ matrix.platform }} -trimpath -ldflags "-s -w"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent build/bin/TableF.app ${{ matrix.artifact }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/TableF.exe -DestinationPath ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # The macOS app is signed with a Developer ID and notarized on a Mac
      # that holds the certificate, then uploaded to the release by hand;
      # CI only attaches the Windows build (which includes DuckDB).
      - uses: softprops/action-gh-release@v2
        with:
          files: TableF-windows-*.zip
          generate_release_notes: true
